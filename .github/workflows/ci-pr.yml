name: CI Pull Request
on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install
        working-directory: services/service_api
      - name: Run ruff
        run: poetry run ruff check .
        working-directory: services/service_api
      - name: Run pytest
        run: poetry run pytest ./tests
        working-directory: services/service_api

      - name: Install dependencies
        run: poetry install
        working-directory: services/service_bot
      - name: Run ruff
        run: poetry run ruff check .
        working-directory: services/service_bot
      - name: Run pytest
        run: poetry run pytest ./tests
        working-directory: services/service_bot

      - name: Install dependencies
        run: poetry install
        working-directory: services/service_parser
      - name: Run ruff
        run: poetry run ruff check .
        working-directory: services/service_parser
      - name: Run pytest
        run: poetry run pytest ./tests
        working-directory: services/service_parser